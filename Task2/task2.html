<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            margin: 0;
            padding: 0;
            background-color: #f2f2f2;
            font-family: "Times New Roman", serif;
        }

        .main{
            width: 420px;
            background-color: #efefef;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
        }

        fieldset{
            border: 1px solid black;
            padding: 15px;
        }

        legend{
            font-size: 20px;
            font-weight: bold;
        }

        label{
            display: block;
            margin-bottom: 6px;
            font-size: 16px;
        }

        .txt{
            width: 350px;
            height: 30px;
            border: 1px solid #bfbfbf;
            border-radius: 4px;
            padding-left: 8px;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .blue{
            background-color: #dfe6f2;
        }

        .radio{
            margin-left: 15px;
        }

        .datebox{
            position: relative;
            width: 360px;
        }

        .date{
            width: 350px;
            height: 30px;
            border: 1px solid #bfbfbf;
            border-radius: 4px;
            padding-left: 8px;
            font-size: 15px;
        }

        .calendar{
            position: absolute;
            right: 10px;
            top: 8px;
            font-size: 15px;
        }

        .address{
            position: relative;
            width: 360px;
        }

        textarea{
            width: 350px;
            height: 40px;
            border: 1px solid #bfbfbf;
            border-radius: 4px;
            padding: 8px;
            font-size: 15px;
            resize: none;
        }

        .icons{
            position: absolute;
            right: 8px;
            bottom: 8px;
            display: flex;
            gap: 6px;
        }

        .icon{
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background-color: teal;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
        }

        button{
            width: 90px;
            height: 38px;
            background-color: white;
            border: 2px solid #4b4b4b;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
        }

    </style>
</head>

<body>

    <div class="main">

        <form>

            <fieldset>

                <legend>User personal information</legend>

                <!-- Full Name -->

                <label>Enter your full name</label>

                <input type="text"
                    value="Vairavel A"
                    class="txt blue">

                <!-- Email -->

                <label>Enter your email</label>

                <input type="email"
                    value="vairavel@gmail.com"
                    class="txt blue">

                <!-- Password -->

                <label>Enter your password</label>

                <input type="password"
                    value="12345"
                    class="txt">

                <!-- Confirm Password -->

                <label>Confirm your password</label>

                <input type="password"
                    value="12345"
                    class="txt">

                <!-- Gender -->

                <label>Enter your gender</label>

                <div>
                    <input type="radio"
                        name="gender"
                        checked> Male

                    <input type="radio"
                        name="gender"
                        class="radio"> Female

                    <input type="radio"
                        name="gender"
                        class="radio"> Others
                </div>

                <br>

                <!-- Date of Birth -->

                <label>Enter your Date of Birth</label>

                <div class="datebox">

                    <input type="text"
                        value="10-03-2006"
                        class="date">

                    <i class="fa-regular fa-calendar calendar"></i>

                </div>

                <br>

                <!-- Address -->

                <label>Enter your Address:</label>

                <div class="address">

                    <textarea>Erode, Tamil Nadu</textarea>

                    <div class="icons">

                        <div class="icon">
                            <i class="fa-solid fa-location-dot"></i>
                        </div>

                        <div class="icon">
                            <i class="fa-brands fa-google"></i>
                        </div>

                    </div>

                </div>

                <br><br>

                <!-- Submit Button -->

                <button type="submit">Submit</button>

            </fieldset>

        </form>

    </div>

</body>

</html>
